[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-ids-ips"
version = "0.1.0"
description = "Cloud-Based Intrusion Detection and Prevention System"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "motor",
    "python-json-logger>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "mongomock-motor",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
python_files = "test_*.py"

[tool.setuptools.packages.find]
include = ["app*"]
